<!--
  Runs before first paint, so nothing flashes:
  - Theme: dark by default; a stored choice always wins.
  - Loader: a fresh load of the homepage opens on the intro film (skipped for
    prefers-reduced-motion, or with ?loader=0). The attribute is set here so the
    film covers the page from the very first frame; app.js then hands its
    wordmark off to the nav. A timer releases the page if app.js never runs.
-->
<script>
  (function () {
    var root = document.documentElement;
    var stored = null, reduced = false;
    try { stored = localStorage.getItem('advatar-theme'); } catch (e) { /* private mode */ }
    try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    root.setAttribute('data-theme', stored === 'light' || stored === 'dark' ? stored : 'dark');
    var home = location.pathname === '/' || location.pathname === '/index.html';
    if (home && !reduced && !/[?&]loader=0(&|$)/.test(location.search)) {
      root.setAttribute('data-loading', '');
      setTimeout(function () { root.removeAttribute('data-loading'); }, 15000);
    }
  })();
</script>
<link rel="preload" as="image" href="/assets/logo-dark.png">
<link rel="preload" as="image" href="/assets/logo-light.png">
</head>
<body>

<!-- Skip link: first thing a keyboard user reaches. -->
<a class="skip-link" href="#main">Skip to content</a>

<!--
  The homepage intro film — only shown while <html data-loading> is set. It
  starts downloading and playing here, during parse, instead of waiting for
  app.js. Click, tap, Escape, Enter or Space skips it.
-->
<div class="loader" aria-hidden="true">
  <video class="loader-video" src="/assets/loader.mp4" muted playsinline preload="none"></video>
  <button type="button" class="loader-skip" tabindex="-1">Skip</button>
</div>
<script>
  (function () {
    if (!document.documentElement.hasAttribute('data-loading')) return;
    var film = document.querySelector('.loader-video');
    film.preload = 'auto';
    var started = film.play();
    if (started && started.catch) started.catch(function () { /* app.js handles it */ });
  })();
</script>

<!--
  Film grain. A fixed, pointer-events-none overlay above backgrounds and video,
  below content. feTurbulence generates the noise; feColorMatrix flattens it to
  greyscale and drops the alpha so it reads as grain rather than colour static.
-->
<svg class="grain-defs" aria-hidden="true" focusable="false">
  <filter id="grain-filter">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.5
                                         0 0 0 0 0.5
                                         0 0 0 0 0.5
                                         0 0 0 0.42 0"/>
  </filter>
</svg>
<div class="grain" aria-hidden="true"></div>

<!--
  Ambient texture so nothing sits on flat colour. The mesh is always present;
  app.js adds a blurred still from settings.textureUrl on top when one is set.
-->
<div class="ambient" aria-hidden="true"></div>

<!--
  Hairline architectural grid — the vertical rules with small × markers at the
  intersections. Purely decorative, sits behind everything.
-->
<div class="grid-rules" aria-hidden="true">
  <span class="grid-rule" style="--rule-x: 8%"></span>
  <span class="grid-rule" style="--rule-x: 92%"></span>
</div>

<div id="app" class="app"></div>

<noscript>

      <a href="mailto:marketing@advatar.co.uk">marketing@advatar.co.uk</a>.</p>
  </div>
</noscript>

<script src="/app.js" type="module"></script>
</body>
