<!--
  Runs before first paint, so nothing flashes:
  - Theme: dark by default; a stored choice always wins.
  - Loader: a fresh load of the homepage opens on the intro film (skipped for
    prefers-reduced-motion, or with ?loader=0). The attribute is set here so the
    film covers the page from the very first frame; app.js then hands its
    wordmark off to the nav. A timer releases the page if app.js never runs.
-->
<script>
  (function () {
    var root = document.documentElement;
    var stored = null, reduced = false;
    try { stored = localStorage.getItem('advatar-theme'); } catch (e) { /* private mode */ }
    try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    root.setAttribute('data-theme', stored === 'light' || stored === 'dark' ? stored : 'dark');
    var home = location.pathname === '/' || location.pathname === '/index.html';
    if (home && !reduced && !/[?&]loader=0(&|$)/.test(location.search)) {
      root.setAttribute('data-loading', '');
      setTimeout(function () { root.removeAttribute('data-loading'); }, 15000);
    }
  })();
</script>
<link rel="preload" as="image" href="/assets/logo-dark.png">
<link rel="preload" as="image" href="/assets/logo-light.png">

<body>

<!-- Skip link: first thing a keyboard user reaches. -->
<a class="skip-link" href="#main">Skip to content</a>

<!--
  The homepage intro film — only shown while <html data-loading> is set. It
  starts downloading and playing here, during parse, instead of waiting for
  app.js. Click, tap, Escape, Enter or Space skips it.
-->
<div class="loader" aria-hidden="true">
  <!--
    The wash carries the film's own background out to the edges of the screen,
    so the film can be shown small — at its real resolution, rather than blown
    up and soft — without sitting in a box on the page. The script below paints
    it by stretching the picture's own outermost row and column outwards, so the
    colour beside the film is the colour at the film's edge the whole way round.
  -->
  <canvas class="loader-wash" aria-hidden="true"></canvas>
  <video class="loader-video" src="/assets/loader.mp4" muted playsinline preload="none"></video>
  <button type="button" class="loader-skip" tabindex="-1">Skip</button>
</div>
<script>
  (function () {
    if (!document.documentElement.hasAttribute('data-loading')) return;
    var loader = document.querySelector('.loader');
    var film = document.querySelector('.loader-video');
    film.preload = 'auto';
    var started = film.play();
    if (started && started.catch) started.catch(function () { /* app.js handles it */ });

    /*
      Carry the film's background out to the edges of the screen, so that a film
      shown at its own size doesn't sit in a visible box.

      The picture is drawn where it actually is, then its outermost column is
      stretched out to the left and right and its outermost row up and down. The
      colour immediately beside the film is therefore the colour of the film's
      own edge at that exact point, all the way round — which is what it takes
      to follow the diagonal wipe from light to dark. Averaging the corners
      instead gives a smooth gradient, and a smooth gradient beside a hard
      diagonal edge is precisely where the box shows.

      The canvas is a quarter-resolution and stretched by CSS: everything in it
      is a soft field, and a full-size one per frame would cost real work on a
      phone. Painted here rather than in app.js so it is already tracking by the
      time the wipe arrives.
    */
    var wash = document.querySelector('.loader-wash');
    var ctx = wash && wash.getContext && wash.getContext('2d');
    if (!ctx) return;
    var SCALE = 4;        // one wash pixel per four on screen
    var BLEED = 0.08;     // and it runs past the screen, so the blur has pixels to find

    function paint() {
      if (!loader.isConnected) return;
      if (film.readyState >= 2 && film.videoWidth) {
        try {
          var vw = loader.clientWidth;
          var vh = loader.clientHeight;
          var padX = vw * BLEED;
          var padY = vh * BLEED;
          var W = Math.max(2, Math.ceil((vw + padX * 2) / SCALE));
          var H = Math.max(2, Math.ceil((vh + padY * 2) / SCALE));
          if (wash.width !== W || wash.height !== H) { wash.width = W; wash.height = H; }

          // Where the picture really is: object-fit: contain, so it may sit
          // inside its own box with a margin of its own.
          var box = film.getBoundingClientRect();
          var k = Math.min(box.width / film.videoWidth, box.height / film.videoHeight);
          var fw = film.videoWidth * k / SCALE;
          var fh = film.videoHeight * k / SCALE;
          var fx = (box.left + (box.width - film.videoWidth * k) / 2 + padX) / SCALE;
          var fy = (box.top + (box.height - film.videoHeight * k) / 2 + padY) / SCALE;

          ctx.imageSmoothingEnabled = true;
          ctx.drawImage(film, fx, fy, fw, fh);

          // Sides first, then the full-width rows above and below them, which
          // takes the corners with it.
          var edge = 1;
          var right = fx + fw;
          var bottom = fy + fh;
          if (fx > 0) ctx.drawImage(wash, fx, fy, edge, fh, 0, fy, fx, fh);
          if (right < W) ctx.drawImage(wash, right - edge, fy, edge, fh, right, fy, W - right, fh);
          if (fy > 0) ctx.drawImage(wash, 0, fy, W, edge, 0, 0, W, fy);
          if (bottom < H) ctx.drawImage(wash, 0, bottom - edge, W, edge, 0, bottom, W, H - bottom);

          // The skip button has to stay legible over both ends of the film.
          var foot = ctx.getImageData(W >> 1, H - 1, 1, 1).data;
          loader.setAttribute('data-wash', (foot[0] + foot[1] + foot[2]) / 3 > 140 ? 'light' : 'dark');
        } catch (e) { return; }   // never hold the intro up over a canvas
      }
      if (film.requestVideoFrameCallback) film.requestVideoFrameCallback(paint);
      else requestAnimationFrame(paint);
    }
    paint();
  })();
</script>

<!--
  Film grain. A fixed, pointer-events-none overlay above backgrounds and video,
  below content. feTurbulence generates the noise; feColorMatrix flattens it to
  greyscale and drops the alpha so it reads as grain rather than colour static.
-->
<svg class="grain-defs" aria-hidden="true" focusable="false">
  <filter id="grain-filter">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.5
                                         0 0 0 0 0.5
                                         0 0 0 0 0.5
                                         0 0 0 0.42 0"/>
  </filter>
</svg>
<div class="grain" aria-hidden="true"></div>

<!--
  Ambient texture so nothing sits on flat colour. The mesh is always present;
  app.js adds a blurred still from settings.textureUrl on top when one is set.
-->
<div class="ambient" aria-hidden="true"></div>

<!--
  Hairline architectural grid — the vertical rules with small × markers at the
  intersections. Purely decorative, sits behind everything.
-->
<div class="grid-rules" aria-hidden="true">
  <span class="grid-rule" style="--rule-x: 8%"></span>
  <span class="grid-rule" style="--rule-x: 92%"></span>
</div>
